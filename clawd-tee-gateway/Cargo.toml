[package]
name = "clawd-tee-gateway"
version = "0.1.0"
edition = "2021"
description = "CLAWD TEE Gateway — proxies AI inference, attests with NVIDIA CC + Intel TDX, anchors proofs on Solana via TeeProofV2"

[[bin]]
name = "clawd-tee-gateway"
path = "src/main.rs"

[dependencies]
# Runtime
tokio        = { version = "1", features = ["full"] }
axum         = { version = "0.7", features = ["http2", "macros"] }
tower        = { version = "0.4" }
tower-http   = { version = "0.5", features = ["cors", "trace", "timeout"] }

# Crypto
sha2         = "0.10"
sha3         = "0.10"
k256         = { version = "0.13", features = ["ecdsa", "pkcs8", "pem"] }
rand         = "0.8"
hex          = "0.4"
subtle       = "2"

# Solana
solana-sdk    = "2.1"
solana-client = "2.1"

# Solana Attestation Service
solana-attestation-service-client = "1.0.9"
borsh         = "1.7"
dashmap       = "6"

# HTTP
reqwest      = { version = "0.12", features = ["json", "stream"] }

# Serialization
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"

# Error handling / logging
anyhow       = "1"
thiserror    = "2"
tracing      = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Config
dotenvy      = "0.15"

# JWT (for NRAS token decoding)
base64       = "0.22"

[dev-dependencies]
tokio        = { version = "1", features = ["full", "test-util"] }
